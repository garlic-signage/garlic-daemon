# garlic-daemon configuration, libconfig syntax: https://hyperrealm.github.io/libconfig/
# Every value is optional, missing values use the defaults shown here.
# Exception: environment is empty by default.
# See README.md, section "Watchdog", for how the values work together.

socket        = "/run/garlic-daemon/garlic-daemon.sock"; # Unix socket for the player, see docs/player-api.md
state_dir     = "/var/lib/garlic-daemon";   # files that must survive a reboot (time of the last watchdog reboot)

# USB sticks are mounted read-only to <mount_dir>/<device>, e.g. /media/garlic/sda1.
# mount_dir belongs to the daemon alone: at its start it unmounts and deletes the directories in it.
# The daemon looks for config.xml, the firmware file and SMIL/index.smil in the root directory.
Usb = {
    mount_dir     = "/media/garlic";
    firmware_file = "garlic-player.AppImage"; # file name of a player update (AppImage of the Linux player)
};

Player = {
    name    = "garlic-player";                # used in log messages
    command = "/opt/garlic-player/garlic.sh"; # started with /bin/sh -c, arguments are allowed
    user    = "digitalsignage";               # user the player runs as (when the daemon runs as root)

    # Extra environment variables for the player, e.g. for the graphical session.
    # Every entry needs the form "KEY=VALUE", it replaces a variable with the same name.
    # X11:     ["DISPLAY=:0", "XAUTHORITY=/home/digitalsignage/.Xauthority"]
    # Wayland: ["WAYLAND_DISPLAY=wayland-0", "XDG_RUNTIME_DIR=/run/user/1000"]
    environment = ["DISPLAY=:0"];

    # Seconds without a "heartbeat" message until the player counts as hanging
    # and is restarted. 0 disables the hang detection.
    heartbeat_timeout = 0;

    # Crashes in a row until the system is rebooted, at most once every 6 hours.
    # 7 is the crash at which the restart delay has reached its maximum of 5 minutes.
    # 0 disables the reboot.
    reboot_after_crashes = 7;
};
