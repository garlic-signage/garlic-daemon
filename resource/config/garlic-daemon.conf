# garlic-daemon configuration, libconfig syntax: https://hyperrealm.github.io/libconfig/
# Every value is optional, missing values use the defaults shown here.

app_name      = "garlic-daemon";
message_queue = "/garlic-daemon";   # POSIX message queue the player sends its commands to

Player = {
    name = "garlic-player";         # process name the watchdog looks for
    path = "/usr/local/bin/";       # directory of the player executable
    user = "digitalsignage";        # user the player runs as
};
